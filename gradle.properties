# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE are ignored when building from the command line, check
# build.gradle files instead.

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

# Gradle Configuration
org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Enable configuration caching
org.gradle.caching=true

# Parallel building
org.gradle.parallel=true

# Enable build cache
org.gradle.build.cache=true

# Android configuration
android.useAndroidX=true
android.enableJetifier=true
android.enableDexingArtifactTransform=true

# Kotlin configuration
kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.js=true

# Version catalog
gradle.warn.version.gradle_plugin_not_specified=false
